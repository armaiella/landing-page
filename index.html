<!-- Note: Original Fonts (Playfair Display for headings & logo, Manrope for body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FFFFFF;
    --tint:#E9F4F9;
    --white:#FFFFFF;
    --ink:#1A1714;
    --black:#171512;
    --black-soft:#332D27;
    --brown:#5B3A26;
    --muted:#7A6656;
    --blue:#AED3E6;
    --blue-deep:#8FBFD9;
    --line: rgba(23,21,18,0.10);
    --radius-lg:18px;
    --radius-md:12px;
    --radius-pill:999px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }

  /* Original Headings Font */
  h1,h2{
    font-family:'Playfair Display', Georgia, serif;
    font-weight:600;
    letter-spacing:-0.2px;
    margin:0;
  }

  em{ font-style:italic; color:var(--blue-deep); font-weight:600; }

  .wrap{ max-width:1120px; margin:0 auto; padding:0 24px; }
  .eyebrow{
    font-size:12px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px; display:block;
  }

  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  /* ---------- Nav ---------- */
  .top-bar{
    background:var(--black); color:var(--white); text-align:center;
    font-size:11.5px; font-weight:500; letter-spacing:0.2px; padding:8px 16px;
  }
  .top-bar a{ color:inherit; text-decoration:none; }
  .top-bar a:hover{ color:var(--blue); }

  header.site-nav{
    position:sticky; top:0; z-index:20;
    background:rgba(255,255,255,0.88);
    backdrop-filter:saturate(150%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    display:flex; align-items:center; justify-content:space-between;
    gap:18px; flex-wrap:wrap; padding:16px 24px; max-width:1120px; margin:0 auto;
  }
  .nav-logo{ font-family:'Playfair Display', serif; font-weight:500; font-size:20px; letter-spacing:-0.2px; }
  .nav-links{ display:flex; gap:26px; flex-wrap:wrap; }
  .nav-links a{ font-size:14px; font-weight:500; color:var(--ink); opacity:0.82; }
  .nav-links a:hover{ opacity:1; color:var(--black); }
  .nav-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .nav-resource{
    display:inline-flex; align-items:center; gap:6px; padding:6px 11px 6px 8px; border-radius:var(--radius-pill);
    background:var(--tint); font-size:12px; font-weight:500; white-space:nowrap; transition:background 0.15s ease;
  }
  .nav-resource .ico{
    width:22px; height:22px; border-radius:50%; background:var(--white); flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .nav-resource .ico svg{ width:12px; height:12px; stroke:var(--blue-deep); }
  .nav-resource:hover{ background:var(--blue); }
  .nav-cta{
    padding:9px 18px; border-radius:var(--radius-pill); background:var(--blue); color:var(--black);
    font-size:13.5px; font-weight:600; white-space:nowrap; transition:background 0.18s ease;
  }
  .nav-cta:hover{ background:var(--blue-deep); }

  /* ---------- Hero ---------- */
  .hero{ position:relative; overflow:hidden; background:var(--white); padding:60px 0 0; }
  .hero-inner{
    display:flex; align-items:flex-end; justify-content:flex-start; flex-wrap:nowrap; gap:56px;
  }
  @media (max-width:640px){ .hero-inner{ gap:12px; } }

  .hero-content{ max-width:580px; padding-bottom:50px; flex:1 1 auto; min-width:0; }
  .hero .eyebrow{ color:var(--brown); }
  .accent{ color:var(--blue-deep); font-weight:800; }
  .hero h1{ font-size:58px; line-height:1.1; letter-spacing:-0.5px; color:var(--black); }
  @media (max-width:860px){ .hero h1{ font-size:40px; } }
  @media (max-width:640px){ .hero h1{ font-size:27px; } }

  .hero p.sub{
    margin-top:20px; font-size:17.5px; line-height:1.6; color:var(--muted); max-width:480px;
  }
  @media (max-width:860px){ .hero p.sub{ font-size:15px; } }
  @media (max-width:640px){ .hero p.sub{ font-size:13.5px; margin-top:12px; } }

  .hero-actions{ display:flex; gap:10px; margin-top:32px; flex-wrap:wrap; }
  .pill{
    display:inline-flex; align-items:center; gap:7px; padding:11px 18px; border-radius:var(--radius-pill);
    background:var(--blue); color:var(--black); font-size:13.5px; font-weight:600; border:1px solid var(--blue);
    transition:background 0.18s ease, transform 0.18s ease;
  }
  .pill svg{ width:15px; height:15px; flex:none; }
  .pill:hover{ background:var(--blue-deep); transform:translateY(-1px); }
  .pill-outline{
    background:transparent; color:var(--black); border:1px solid var(--line); font-weight:500;
  }
  .pill-outline:hover{ background:var(--tint); }

  .hero-photo-wrap{ display:flex; justify-content:flex-end; align-self:flex-end; flex:none; }
  .hero-photo{
    width:100%; max-width:400px; max-height:560px; object-fit:contain; display:block;
  }
  @media (max-width:860px){ .hero-photo{ max-width:260px; max-height:400px; } }
  @media (max-width:640px){ .hero-photo{ max-width:120px; max-height:200px; } }

  .tag-row{
    margin-top:22px; font-size:13px; font-weight:600; letter-spacing:0.3px; color:var(--ink);
  }
  @media (max-width:640px){ .tag-row{ margin-top:14px; font-size:11px; } }
  .tag-row span{ color:var(--blue-deep); margin:0 6px; }

  .coverage{
    margin-top:8px; font-size:12.5px; line-height:1.5; color:var(--muted); max-width:440px;
  }
  @media (max-width:640px){ .coverage{ font-size:10.5px; } }

  .float-card{
    margin-top:18px; background:var(--white); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:14px 16px; display:flex; align-items:center; gap:12px;
    max-width:280px;
  }
  .float-card .badge-icon{
    width:36px; height:36px; border-radius:50%; background:var(--blue); flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .float-card .badge-icon svg{ width:16px; height:16px; stroke:var(--black); }
  .float-card .label{ font-size:13px; font-weight:600; color:var(--ink); }
  .float-card .sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }

  /* ---------- Section shell ---------- */
  section.band{ padding:88px 0; }
  @media (max-width:640px){ section.band{ padding:56px 0; } }
  .band.tint{ background:var(--black); color:var(--white); }
  .band.tint .eyebrow{ color:var(--blue); }
  .band.tint .band-head h2{ color:var(--white); }
  .band.tint .card-body .title{ color:var(--black); }
  .band-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:38px; flex-wrap:wrap; }
  .band-head h2{ font-size:30px; }

  /* ---------- Cards row (horizontal scroll) ---------- */
  .grid{
    display:flex; gap:20px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding-bottom:10px; -webkit-overflow-scrolling:touch;
  }
  .grid::-webkit-scrollbar{ height:6px; }
  .grid::-webkit-scrollbar-thumb{ background:var(--line); border-radius:999px; }
  .grid .card{ flex:0 0 260px; scroll-snap-align:start; }

  .card{
    display:block; border-radius:var(--radius-lg); overflow:hidden; background:var(--white);
    border:1px solid var(--line); transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover{ transform:translateY(-4px); box-shadow:0 16px 32px rgba(27,23,18,0.10); }

  .ph-image{
    aspect-ratio:4/3; background:linear-gradient(135deg, var(--tint), var(--white));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  }
  .ph-image svg{ width:30px; height:30px; stroke:var(--blue-deep); opacity:0.5; }
  .ph-image span{ font-size:11.5px; color:var(--muted); opacity:0.7; }

  .card-body{ padding:16px 18px 18px; }
  .card-body .title{ font-size:15px; font-weight:600; }
  .card-body .meta{ font-size:12.5px; color:var(--muted); margin-top:4px; }

  .tag{
    display:inline-block; font-size:11px; font-weight:600; letter-spacing:0.8px; text-transform:uppercase;
    background:var(--tint); color:var(--black); padding:5px 11px; border-radius:var(--radius-pill); margin-bottom:10px;
  }

  /* ---------- Newsletter ---------- */
  .newsletter-card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:38px 34px; text-align:left; max-width:560px; margin:0 auto;
  }
  .newsletter-card h2{ font-size:24px; color:var(--black); }
  .newsletter-card p{ font-size:13.5px; line-height:1.55; color:var(--ink); opacity:0.82; margin:10px 0 18px; }
  .subscribe-form{ display:flex; gap:8px; flex-wrap:wrap; }
  .subscribe-form input[type="email"]{
    flex:1 1 180px; padding:12px 14px; border-radius:8px; border:1px solid var(--line);
    background:var(--tint); font-family:inherit; font-size:13.5px; color:var(--ink);
  }
  .subscribe-form input[type="email"]:focus-visible{ outline:2px solid var(--blue-deep); }
  .subscribe-form button{
    padding:12px 22px; border-radius:8px; background:var(--blue); color:var(--black); border:none;
    font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer; transition:background 0.18s ease;
  }
  .subscribe-form button:hover{ background:var(--blue-deep); }

  /* ---------- Footer ---------- */
  footer.site-footer{
    padding:52px 24px 44px; text-align:center; background:var(--black); color:var(--white);
  }
  footer.site-footer .foot-links{ display:flex; gap:18px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
  footer.site-footer .foot-links a{ font-size:13px; font-weight:500; color:var(--white); opacity:0.85; }
  footer.site-footer .foot-links a:hover{ opacity:1; color:var(--blue); }
  footer.site-footer p{ font-size:11.5px; color:var(--blue); opacity:0.75; line-height:1.6; margin:0; }
</style>
</head>
